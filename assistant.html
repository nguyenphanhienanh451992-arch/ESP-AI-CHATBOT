<title>ESP AI Chatbot · AI Assistant</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#142e49;background:#f2f8fc;--navy:#0c2e53;--blue:#0964ce;--sky:#cce9fa;--border:#b6d5eb}
*{box-sizing:border-box} body{margin:0} button,input{font:inherit} button,a{touch-action:manipulation} button{cursor:pointer} a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #ecaa43;outline-offset:3px}
header{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:14px clamp(18px,4vw,56px);background:var(--navy);color:#fff}
header strong{font-size:23px} nav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto} nav a,.back{padding:10px 12px;border-radius:9px} nav [aria-current],nav a:hover,.back:hover{background:var(--blue)}
main{max-width:1200px;margin:auto;padding:14px clamp(16px,4vw,48px) 35px}
.toolbar{display:flex;justify-content:flex-end;gap:16px;margin-bottom:12px;align-items:center}
.toolbar button{color:var(--navy);border:0;background:transparent;font-weight:700;padding:8px}
#translate{background:var(--sky);border:1px solid var(--border);border-radius:10px;padding:6px 8px 6px 12px}
#language{display:inline-block;background:var(--blue);color:white;border-radius:6px;padding:4px 8px;margin-left:5px}
.layout{display:grid;grid-template-columns:minmax(215px,1fr) minmax(0,1.76fr);gap:18px}
.mascot,.chat{border-radius:21px;min-height:450px}
.mascot{position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;background:#cce9fa}
.halo{position:absolute;width:77%;aspect-ratio:1;top:14%;left:11.5%;border:2px solid #f5fcff;border-radius:50%;background:radial-gradient(#f5fcff,#dcf3ff)}
.halo::after{content:"";position:absolute;inset:8%;border:1px solid #a9d9f6;border-radius:50%}
.wave{position:absolute;bottom:-38%;left:-55%;width:204%;height:68%;border-radius:50%;background:#a3d9f4;transform:rotate(-8deg)}
.wave.second{bottom:-45%;left:4%;background:#78c5ef;transform:rotate(-16deg)}
.shadow{position:absolute;bottom:14%;width:56%;height:5%;border-radius:50%;background:#67b9e7}
.robot{position:relative;z-index:1;width:min(75%,265px);height:auto;max-height:76%;object-fit:contain;filter:drop-shadow(0 8px 16px #0872c62c)}
.star{position:absolute;z-index:2;width:18px;aspect-ratio:1;color:#fff;background-size:100% 100%;clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%)}
.star:nth-of-type(1){top:28%;left:12%;}
.star:nth-of-type(2){top:26%;right:13%;width:23px;}
.star:nth-of-type(3){top:58%;right:12%;width:13px;}
.star:nth-of-type(4){top:65%;left:14%;width:15px;}

.chat{background:white;border:1px solid var(--border);padding:clamp(16px,3vw,28px)}
form{display:flex;gap:8px;border:1px solid var(--border);border-radius:12px;padding:6px;margin:25px 0 18px}
input{min-width:0;flex:1;border:0;background:transparent;padding:8px;color:var(--navy)}
.send{border:0;border-radius:9px;background:var(--blue);color:white;font-weight:700;padding:9px 16px}
.shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.shortcuts button{border:1px solid var(--border);border-radius:12px;background:white;color:var(--navy);text-align:left;padding:14px;min-height:58px;font-weight:700;display:flex;align-items:center;gap:10px}
.shortcuts button:hover{background:#eef8ff}.shortcut-icon{width:30px;height:30px;display:grid;place-items:center;flex:none;border-radius:50%;background:var(--sky);color:var(--blue)}
#status{margin-top:18px;color:#425b72;line-height:1.5}
@media(max-width:720px){header{gap:8px} nav{margin-left:0;width:100%} .layout{grid-template-columns:1fr} .mascot{min-height:250px}.robot{height:205px;width:auto}.halo{width:210px;left:calc(50% - 105px);top:9%}.chat{min-height:240px}form{margin-top:0}}
@media(max-width:410px){.shortcuts{grid-template-columns:1fr}}

/* Original English Studio styling preserved; added functional chat interface */
.brand-sub{font-weight:400;opacity:.78;font-size:14px}
.chat{display:flex;flex-direction:column;height:min(700px,calc(100vh - 180px));min-height:520px;overflow:hidden}
.chat-heading{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--border);gap:12px}
.chat-heading strong{font-size:17px}.chat-heading p{margin:4px 0 0;font-size:12px;color:#627b91}
.online-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#25a477;margin-right:9px}
.pill-ai{font-weight:800;background:#e9f4ff;color:#0964ce;padding:6px 9px;border-radius:9px;font-size:12px}
.messages{min-height:100px;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 3px 12px;display:flex;flex-direction:column;gap:15px;scrollbar-color:#b6d5eb transparent}
.welcome{margin:auto;text-align:center;display:grid;gap:9px;color:#52708c;max-width:360px;line-height:1.5}
.welcome strong{color:var(--navy);font-size:20px}.welcome span{font-size:13px}
.bubble-row{display:flex;gap:10px;max-width:90%;align-items:flex-start}.bubble-row.user{margin-left:auto;flex-direction:row-reverse}
.avatar{flex:none;display:grid;place-items:center;height:31px;width:31px;border-radius:11px;background:#e5f3fe;color:#0964ce;font-size:12px;font-weight:800}
.user .avatar{background:#d8e8f8;color:#194c7d}
.bubble{background:#eff7fd;border:1px solid #d7e9f8;border-radius:15px 15px 15px 5px;padding:12px 15px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;min-width:0}
.user .bubble{background:#0e64bb;color:#fff;border-color:#0e64bb;border-radius:15px 15px 5px 15px}
.bubble p{margin:0 0 9px}.bubble p:last-child{margin-bottom:0}.bubble strong{font-weight:750}.bubble a{color:#055c9d;text-decoration:underline;overflow-wrap:anywhere}.user .bubble a{color:#fff}
.bubble ul,.bubble ol{margin:6px 0 8px;padding-left:20px}.bubble li{margin:2px 0}.bubble code{background:#e1ecf6;border-radius:4px;padding:1px 4px}
.bubble pre{white-space:pre-wrap;background:#e1ecf6;border-radius:8px;padding:9px;overflow:auto}
.typing{display:flex;gap:5px;align-items:center;min-height:19px}.typing i{width:6px;height:6px;background:#6998c5;border-radius:50%;animation:dot 1.1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.chat form{flex:none;margin:12px 0 12px}.chat form:focus-within{border-color:#0964ce;box-shadow:0 0 0 3px #0964ce15}
.chat form input:focus{outline:none}.chat form .send:disabled{opacity:.6;cursor:not-allowed}
.shortcuts{flex:none;margin-bottom:4px}.shortcuts button{font-size:12px;min-height:45px;padding:10px}
#status{font-size:12px;margin:4px 0;color:#a04135}.privacy-note{text-align:center;font-size:10px;color:#7c8fa0;margin:8px 0 0}
@media(max-width:720px){.chat{height:70vh;min-height:490px}.mascot{min-height:160px}.robot{height:150px}.chat-heading{padding-bottom:10px}.messages{padding-top:12px}header strong{font-size:19px}}
@media(max-width:410px){.chat{min-height:520px}.bubble-row{max-width:97%}.shortcuts{grid-template-columns:repeat(2,minmax(0,1fr))}.shortcuts button{padding:7px;font-size:11px;min-height:46px}}
@media(prefers-reduced-motion:reduce){.typing i{animation:none}}
</style>

<script>

const API_FALLBACK='https://super-bird-661f.nguyenphanhienanh451992.workers.dev';
const copy={

const prompts={en:{word:'Explain the meaning and usage of: ',cards:'Create flashcards for: ',mcq:'Create a multiple-choice exercise about: ',match:'Create a matching exercise about: '},vi:{word:'Giải thích nghĩa và cách dùng từ: ',cards:'Tạo thẻ từ vựng về: ',mcq:'Tạo bài tập trắc nghiệm về: ',match:'Tạo bài tập nối từ về: '}};
const input=document.getElementById('request');
const messages=document.getElementById('messages');
const status=document.getElementById('status');
const send=document.getElementById('send');
const translate=document.getElementById('translate');
let language='en',busy=false,sessionToken='';
const base=(window.ESP_CONFIG&&window.ESP_CONFIG.apiUrl)||API_FALLBACK;
function clientId(){let id='';try{id=localStorage.getItem('esp_client_id')||'';if(!id){id='web-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));localStorage.setItem('esp_client_id',id)}}catch(_){id='web-'+Math.random().toString(36).slice(2)}return id;}
const client=clientId();
function renderLanguage(){const t=copy[language];document.documentElement.lang=language;document.querySelectorAll('[data-copy]').forEach(el=>{const key=el.dataset.copy;if(key in t)el.textContent=t[key]});document.querySelector('nav').setAttribute('aria-label',t.navigation);input.placeholder=t.placeholder;input.setAttribute('aria-label',t.requestLabel);translate.setAttribute('aria-label',t.translate);document.getElementById('language').textContent=language.toUpperCase();}
function clean(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeInline(text){let t=clean(text);t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');t=t.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');t=t.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_m,label,url)=>'<a href="'+url.replace(/&amp;/g,'&amp;')+'" target="_blank" rel="noopener noreferrer">'+label+'</a>');return t;}
function formatAnswer(raw){let t=String(raw||'').replace(/\r/g,'').slice(0,50000);if(!t)return clean(copy[language].empty);return t.split(/\n\s*\n/).map(p=>{let lines=p.split('\n');if(lines.every(x=>/^\s*[-*] /.test(x)))return '<ul>'+lines.map(x=>'<li>'+safeInline(x.replace(/^\s*[-*] /,''))+'</li>').join('')+'</ul>';if(lines.every(x=>/^\s*\d+\. /.test(x)))return '<ol>'+lines.map(x=>'<li>'+safeInline(x.replace(/^\s*\d+\. /,''))+'</li>').join('')+'</ol>';return '<p>'+lines.map(safeInline).join('<br>')+'</p>'}).join('');}
function addBubble(text,isUser=false,isLoading=false){document.getElementById('welcome')?.remove();const row=document.createElement('div');row.className='bubble-row'+(isUser?' user':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=isUser?'YOU':'AI';const bubble=document.createElement('div');bubble.className='bubble';if(isLoading)bubble.innerHTML='<span class="typing" aria-label="Loading"><i></i><i></i><i></i></span>';else if(isUser)bubble.textContent=text;else bubble.innerHTML=formatAnswer(text);row.append(avatar,bubble);messages.append(row);messages.scrollTop=messages.scrollHeight;return row;}
function setBusy(next){busy=next;send.disabled=next;input.disabled=next;document.querySelectorAll('[data-prompt]').forEach(b=>b.disabled=next);}
async function sendMessage(message){if(busy||!message.trim())return;status.hidden=true;addBubble(message,true);input.value='';setBusy(true);const loading=addBubble('',false,true);const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),100000);try{
 const resp=await fetch(base.replace(/\/$/,'')+'/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'indexSend',args:[{message:message.trim(),sessionToken}],clientId:client}),signal:controller.signal});
 const obj=await resp.json().catch(()=>({ok:false,error:'Invalid Worker response'}));
 if(!resp.ok||!obj.ok)throw new Error(obj.error||('Worker HTTP '+resp.status));
 const data=obj.data||{};if(data.sessionToken)sessionToken=data.sessionToken;
 loading.remove();addBubble(data.answer||data.bodyText||copy[language].empty);
 }catch(err){loading.remove();addBubble((err.name==='AbortError'?(language==='vi'?'Yêu cầu quá thời gian chờ.':'Request timed out.'):err.message)||copy[language].error);status.textContent=copy[language].error;status.hidden=false;}finally{clearTimeout(timer);setBusy(false);input.focus();}}
translate.addEventListener('click',()=>{language=language==='en'?'vi':'en';renderLanguage();});
document.querySelectorAll('[data-prompt]').forEach(btn=>btn.addEventListener('click',()=>{input.value=prompts[language][btn.dataset.prompt]+(input.value.trim()?' '+input.value.trim():'');input.focus();}));
document.getElementById('reset').addEventListener('click',()=>{if(busy)return;sessionToken='';input.value='';messages.innerHTML='<div class="welcome" id="welcome"><strong data-copy="welcome"></strong><span data-copy="welcomeHint"></span></div>';status.hidden=true;renderLanguage();input.focus();});
document.getElementById('back').addEventListener('click',event=>{if(document.referrer){try{if(new URL(document.referrer).origin===location.origin){event.preventDefault();history.back();}}catch(_){}}});
document.getElementById('composer').addEventListener('submit',event=>{event.preventDefault();sendMessage(input.value)});
renderLanguage();
