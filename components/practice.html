<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>ESP AI CHATBOT - Vocabulary Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<!-- Practice runs inside its own iframe: load the API bridge in THIS document. -->
<script src="../js/config.js"></script>

<style>
  :root { color-scheme: light; --ink: #0c2030; --teal: #006b56; --mint: #dcf6ef; --line: #b7c4d2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 500 16px/1.4 "Inter", Arial, sans-serif; }
  [hidden], .hidden { display: none !important; }
  .practice-container { max-width: 1440px; margin: auto; }
  .top { background: var(--teal); color: white; padding: 10px clamp(20px,4vw,52px); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .translate { display: inline-flex; align-items: center; gap: 10px; border: 1px solid #a6d9ce; border-radius: 11px; background: var(--mint); color: var(--teal); padding: 6px 8px 6px 12px; font: 700 14px/1.25 Inter, Arial, sans-serif; cursor: pointer; }
  .translate:focus-visible { outline-color: #fff; }
  .translate-code { min-width: 2.5em; padding: 4px 6px; border-radius: 6px; background: var(--teal); color: #fff; text-align: center; }
  .top h1 { display: flex; align-items: center; gap: 22px; margin: 0; font-size: clamp(21px,3vw,34px); font-weight: 750; }
  .header-robot { flex: none; padding-right: 22px; border-right: 1px solid #fff; }
  .robot-badge {
    display: block;
    width: clamp(40px, 4vw, 50px);
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 50%;
    background: #fff;
  }
  .robot-badge img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: center 90%;
    animation: robot-rock 2.8s ease-in-out infinite;
  }
  @keyframes robot-rock {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-11deg); }
    75% { transform: rotate(11deg); }
  }
  .content {
    display: grid;
    grid-template-columns: fit-content(100%) minmax(0,1fr);
    padding: 18px clamp(16px,3.2vw,44px) 0;
  }
  .content > :not(.group-title) { grid-column: 1 / -1; min-width: 0; }
  .practice-context, .choices { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
  .practice-context { margin: 0 0 34px; }
  .practice-context label { display: grid; gap: 5px; min-width: 0; font-weight: 650; }
  .practice-context input, .practice-context select { width: 100%; min-height: 42px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: inherit; font: inherit; }
  .group-title { margin: 0 0 12px; font-size: clamp(19px,2.2vw,25px); font-weight: 750; }
  .practice-context label > span, .group-title {
    width: fit-content;
    max-width: 100%;
    border-radius: 999px;
    background: var(--teal);
    color: #fff;
  }
  .practice-context label > span { padding: 4px 12px; }
  .group-title {
    grid-column: 1;
    width: auto;
    padding: 2px 6px;
  }
  .choices { margin-bottom: 23px; }
  .choice { position: relative; display: flex; align-items: center; gap: 16px; padding: 12px 20px; min-height: 60px; border: 2px solid transparent; border-radius: 14px; background: var(--mint); color: inherit; text-align: left; font: inherit; font-weight: 650; cursor: pointer; }
  .ico { flex: none; }
  .choice .ico { color: var(--teal); font-size: 24px; }
  .choice:hover { border-color: #56ab98; }
  .choice[aria-pressed="true"] { border-color: #009e7c; color: #006b56; }
  .choice[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 6px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: #008c70; color: #fff; text-align: center; font-size: 14px; }
  .skills { grid-template-columns: repeat(4,minmax(0,1fr)); margin-bottom: 0; }
  .skills .choice { min-height: clamp(94px,12vw,142px); flex-direction: column; justify-content: center; gap: 4px; border-radius: 22px; padding: 12px 7px; text-align: center; font-size: clamp(16px,2.25vw,26px); }
  .skills .ico { font-size: clamp(27px,4vw,47px); line-height: 1.15; }
  .skills .choice:nth-child(1) { background: #cceafa; }
  .skills .choice:nth-child(2) { background: #eedafa; }
  .skills .choice:nth-child(3) { background: #fff0cb; }
  .skills .choice:nth-child(4) { background: #d9faee; }
  .writing-levels { position: relative; display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin: 22px 0 0; padding: 15px; border: 1px solid var(--line); border-radius: 16px; }
  .writing-levels::before { content: ""; position: absolute; right: 10%; top: -9px; width: 16px; height: 16px; background: #fff; border-top: 1px solid var(--line); border-left: 1px solid var(--line); transform: rotate(45deg); }
  .writing-levels label { display: flex; align-items: center; gap: 9px; padding: 12px; border: 1px solid var(--line); border-radius: 11px; font-weight: 650; cursor: pointer; }
  .writing-levels label:has(input:checked) { background: #d9faee; border-color: #009e7c; }
  .writing-levels input { width: 19px; height: 19px; flex: none; accent-color: #009e7c; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; margin: 16px clamp(16px,3.2vw,44px) 0; border-radius: 15px; background: var(--mint); }
  .foot .choice { min-height: 48px; padding: 6px 10px; background: transparent; }
  .foot .choice::before { content: ""; width: 20px; height: 20px; flex: none; border: 2px solid var(--teal); border-radius: 4px; }
  .foot .choice[aria-pressed="true"]::before { content: "✓"; background: var(--teal); color: #fff; text-align: center; line-height: 16px; }
  .foot .choice[aria-pressed="true"]::after { content: none; }
  .go, #practiceReplyBtn { border: 0; border-radius: 11px; background: var(--teal); color: white; padding: 10px 24px; font: inherit; font-size: clamp(16px,2.1vw,24px); font-weight: 750; cursor: pointer; white-space: nowrap; }
  .go:disabled { opacity: .56; cursor: not-allowed; }
  :focus-visible { outline: 3px solid #00876b; outline-offset: 3px; }
  #practiceStatus { display: block; margin: 7px clamp(16px,3.2vw,44px) 14px; color: #006b56; font-size: 14px; }
  .output-box { margin: 16px clamp(16px,3.2vw,44px); padding: 18px; border: 1px solid var(--line); border-radius: 16px; overflow-wrap: anywhere; }
  .prose p { margin: 0 0 .75em; }
  .prose img { max-width: 100%; }
  .reply { display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .reply input { flex: 1 1 180px; min-width: 0; padding: 9px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  #practiceReplyBtn { font-size: 15px; }
  @media (min-width: 721px) {
    .practice-context input, .practice-context select, .choices:not(.skills) .choice {
      min-height: 60px;
    }
    .choices:not(.skills) .choice { padding: 6px clamp(10px, 1.5vw, 20px); }
  }
  @media (max-width: 720px) {
    .practice-context { gap: 12px; margin-inline: 0; }
    .choices:not(.skills) { grid-template-columns: repeat(2,minmax(0,1fr)); }
    .choice { padding: 10px; gap: 8px; }
    .writing-levels { gap: 7px; padding: 9px; }
  }
  @media (max-width: 520px) {
    .practice-context, .writing-levels { grid-template-columns: 1fr; }
    .writing-levels::before { right: 22%; }
    .skills { grid-template-columns: repeat(2,minmax(0,1fr)); }
    .foot { align-items: stretch; flex-direction: column; }
  }

  /* GitHub Pages iframe: retain original design without clipping content. */
  html, body { height:auto!important; min-height:0!important; overflow-x:hidden; overflow-y:visible!important; }
  .practice-container { width:100%; }
  .prose { overflow-wrap:anywhere; line-height:1.65; }
  .prose pre { overflow-x:auto; }
  @media (max-width:720px) { .top h1 { gap:10px; } .header-robot { padding-right:10px; } }
</style>
</head>

      <h2 class="group-title" id="skillsTitle"><span data-vi="Chọn kỹ năng vận dụng">Choose Skills to Practise</span></h2>
      <div class="choices skills" role="group" aria-labelledby="skillsTitle">
      <button type="button" class="choice" data-type="7" aria-pressed="false"><span class="ico" aria-hidden="true"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15v-3a9 9 0 0 1 18 0v3 M3 15v3a2 2 0 0 0 2 2h2v-7H5a2 2 0 0 0-2 2z M21 15v3a2 2 0 0 1-2 2h-2v-7h2a2 2 0 0 1 2 2z"/></svg></span><span data-vi="Luyện nghe">Listening</span></button>
      <button type="button" class="choice" data-type="8" aria-pressed="false"><span class="ico" aria-hidden="true"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21v-2a6 6 0 0 1 12 0v2 M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M16 5a5 5 0 0 1 0 5 M19 3a8 8 0 0 1 0 9"/></svg></span><span data-vi="Luyện nói">Speaking</span></button>
      <button type="button" class="choice" data-type="9" aria-pressed="false"><span class="ico" aria-hidden="true"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v15 M2 4c4-1 7-1 10 1 3-2 6-2 10-1v15c-4-1-7-1-10 1-3-2-6-2-10-1z"/></svg></span><span data-vi="Luyện đọc">Reading</span></button>
      <button type="button" class="choice" data-type="10" aria-pressed="false" aria-controls="writingLevels" aria-expanded="false"><span class="ico" aria-hidden="true"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l2-6L17 3a2 2 0 0 1 3 3L8 19z M14 6l4 4"/></svg></span><span data-vi="Luyện viết">Writing</span></button>
      </div>
      <div id="writingLevels" class="writing-levels" role="group" aria-label="Choose a writing level" data-vi-aria-label="Chọn mức luyện viết" hidden>
        <label><input type="radio" name="practiceWritingLevel" value="1"> <span data-vi="Level 1 · Sắp xếp câu">Level 1 · Sentence Reordering</span></label>
        <label><input type="radio" name="practiceWritingLevel" value="2"> <span data-vi="Level 2 · Viết hội thoại">Level 2 · Dialogue Writing</span></label>
        <label><input type="radio" name="practiceWritingLevel" value="3"> <span data-vi="Level 3 · Viết đoạn văn">Level 3 · Paragraph Writing</span></label>
      </div>
    </div>
    <div class="foot">
      <button type="button" class="choice" data-type="11" aria-pressed="false"><span data-vi="Để chatbot tự chọn dạng phù hợp">Let the chatbot choose</span></button>
      <button id="startPracticeBtn" class="go" type="button" disabled><span aria-hidden="true">✧</span> <span data-vi="Tạo bài tập">Generate Exercises</span></button>
    </div>
    <span id="practiceStatus" role="status"></span>
    <section id="practiceOutputBox" class="output-box" hidden>
      <div id="practiceContent" class="prose"></div>
      <div class="reply">
        <input id="practiceReplyInput" type="text" aria-label="Answer or reply" data-vi-aria-label="Đáp án hoặc câu trả lời" placeholder="Enter your answer or reply..." data-vi-placeholder="Nhập đáp án hoặc câu trả lời...">
        <button id="practiceReplyBtn" type="button"><span data-vi="Gửi trả lời">Send Reply</span></button>
      </div>
    </section>
  </main>
</div>

<script>
  'use strict';
  let practiceSessionToken = sessionStorage.getItem('dify_practice_token') || '';
  let selectedTypes = [];
  let generating = false;
  let interfaceLanguage = 'en';
  let statusMessage = ['', ''];
  const status = document.getElementById('practiceStatus');
  const translateBtn = document.getElementById('translateBtn');
  const interfaceCopy = ['data-vi', 'data-vi-placeholder', 'data-vi-aria-label']
    .flatMap(attribute => Array.from(document.querySelectorAll(`[${attribute}]`), element => {
      const target = attribute.slice('data-vi-'.length);
      const en = target ? element.getAttribute(target) : element.textContent;
      const vi = element.getAttribute(attribute);
      return { element, target, en, vi };
    }));

  function localize(en, vi) {
    return interfaceLanguage === 'en' ? en : vi;
  }

  function setStatus(en, vi) {
    statusMessage = [en, vi];
    status.textContent = localize(en, vi);
  }

  translateBtn.onclick = () => {
    interfaceLanguage = localize('vi', 'en');
    document.documentElement.lang = interfaceLanguage;
    for (const { element, target, en, vi } of interfaceCopy) {
      if (target) element.setAttribute(target, localize(en, vi));
      else element.textContent = localize(en, vi);
    }
    translateBtn.querySelector('.translate-code').textContent = localize('EN', 'VN');
    translateBtn.setAttribute('aria-label', localize(
      'Switch interface to Vietnamese', 'Chuyển giao diện sang tiếng Anh'
    ));
    setStatus(...statusMessage);
    if (emptyAnswer) {
      document.getElementById('practiceContent').textContent = localize(
        'No response content was received.', 'Không có nội dung phản hồi.'
      );
    }
  };

  let emptyAnswer = false;
  const writingLevels = document.getElementById('writingLevels');
  writingLevels.addEventListener('change', updatePracticeState);

  // Xử lý chọn/bỏ chọn các nút dạng bài (Tiles)
  document.querySelectorAll('.choice').forEach(btn => {
    btn.onclick = () => {
      const typeId = parseInt(btn.getAttribute('data-type'));
      const isPressed = btn.getAttribute('aria-pressed') === 'true';

      if (typeId === 11 || typeId === 6) {
        // Nếu chọn tự chọn hoặc tổng hợp, reset các nút khác
        document.querySelectorAll('.choice').forEach(b => {
          b.setAttribute('aria-pressed', 'false');
        });
        selectedTypes = isPressed ? [] : [typeId];
        btn.setAttribute('aria-pressed', String(!isPressed));
      } else {
        // Nếu chọn các dạng thường, bỏ chọn 6 và 11 nếu đang bật
        selectedTypes = selectedTypes.filter(t => t !== 6 && t !== 11);
        document.querySelectorAll('.choice[data-type="6"], .choice[data-type="11"]').forEach(b => {
          b.setAttribute('aria-pressed', 'false');
        });

        if (isPressed) {
          btn.setAttribute('aria-pressed', 'false');
          selectedTypes = selectedTypes.filter(t => t !== typeId);
        } else {
          btn.setAttribute('aria-pressed', 'true');
          selectedTypes.push(typeId);
        }
      }

      updatePracticeState();
    };
  });

  function updatePracticeState() {
    const btn = document.getElementById('startPracticeBtn');
    const hasWriting = selectedTypes.includes(10);
    writingLevels.hidden = !hasWriting;
    document.querySelector('[data-type="10"]').setAttribute('aria-expanded', String(hasWriting));
    const selectedWritingLevel = writingLevels.querySelector('input:checked');
    if (!hasWriting && selectedWritingLevel) selectedWritingLevel.checked = false;

    if (hasWriting && !selectedWritingLevel) {
      btn.disabled = true;
      setStatus('Choose Writing Level 1, 2 or 3.', 'Vui lòng chọn Writing Level 1, 2 hoặc 3.');
    } else if (selectedTypes.length > 0) {
      btn.disabled = generating;
      const count = selectedTypes.length;
      setStatus(`${count} exercise ${count === 1 ? 'type' : 'types'} selected.`, `Đã chọn ${count} dạng bài tập.`);
    } else {
      btn.disabled = true;
      setStatus('Choose at least one exercise type.', 'Vui lòng chọn ít nhất một dạng bài tập.');
    }
  }

  // Bấm nút bắt đầu tạo bài tập
  document.getElementById('startPracticeBtn').onclick = () => {
    if (generating || !selectedTypes.length) return;
    const topic = document.getElementById('practiceTopic').value.trim();
    const words = document.getElementById('practiceWords').value.trim();
    
    if (!topic && !words) {
      setStatus('⚠️ Enter a topic or target vocabulary.', '⚠️ Vui lòng nhập chủ đề hoặc từ vựng mục tiêu!');
      document.getElementById('practiceTopic').focus();
      return;
    }

    const writingLevel = writingLevels.querySelector('input:checked');
    if (selectedTypes.includes(10) && !writingLevel) {
      updatePracticeState();
      return;
    }

    if (!window.google?.script?.run) {
      setStatus('The Cloudflare Worker connection is not ready. Check js/config.js and js/bridge.js.', 'Chưa kết nối Cloudflare Worker. Kiểm tra js/config.js và js/bridge.js.');
      return;
    }
    generating = true;
    updatePracticeState();
    setStatus('⏳ Generating exercises with Dify AI...', '⏳ Đang kết nối Dify AI để sinh bài tập...');

    google.script.run
      .withSuccessHandler(res => {
        generating = false;
        updatePracticeState();
        if (!res || typeof res.answer !== 'string') {
          setStatus('❌ AI response is missing exercise content.', '❌ AI chưa trả về nội dung bài tập.');
          return;
        }
        setStatus('✅ Exercises generated!', '✅ Đã tạo bài tập thành công!');
        if (res && res.sessionToken) {
          practiceSessionToken = res.sessionToken;
          sessionStorage.setItem('dify_practice_token', practiceSessionToken);
        }
        
        // Hiển thị nội dung trực tiếp từ Dify
        displayPracticeAnswer(res.answer);
      })
      .withFailureHandler(err => {
        generating = false;
        updatePracticeState();
        setStatus('❌ Error: ' + (err.message || err), '❌ Lỗi: ' + (err.message || err));
      })
      .generatePractice({
        selectedTypes: [...selectedTypes],
        learner_level: document.getElementById('practiceCefr').value,
        topic: topic,
        words: words,
        message: selectedTypes.includes(10)
          ? 'Tôi chọn Writing Level ' + writingLevel.value + ' cho dạng 10 – Luyện viết.'
          : ''
      });
  };

  function displayPracticeAnswer(answerText) {
    const box = document.getElementById('practiceOutputBox');
    const content = document.getElementById('practiceContent');
    let displayText = answerText;
    if (typeof answerText === 'string') {
      try {
        const structured = JSON.parse(answerText.trim().replace(/^```(?:json)?\s*|\s*```$/gi, ''));
        if (typeof structured?.display_text === 'string') displayText = structured.display_text;
      } catch (_) {
        // Plain Markdown is also supported by the Practice endpoint.
      }
    }
    emptyAnswer = typeof displayText !== 'string' || !displayText.trim();
    if (emptyAnswer) {
      displayText = localize('No response content was received.', 'Không có nội dung phản hồi.');
    }
    if (window.marked && window.DOMPurify) {
      content.innerHTML = DOMPurify.sanitize(marked.parse(displayText));
    } else {
      content.textContent = displayText;
    }
    box.hidden = false;
  }

  // Gửi câu trả lời tiếp theo trong phiên luyện tập
  document.getElementById('practiceReplyBtn').onclick = () => {
    const replyInput = document.getElementById('practiceReplyInput');
    const message = replyInput.value.trim();
    if (!message) return;

    replyInput.value = '';
    setStatus('⏳ Sending your reply to Dify AI...', '⏳ Đang gửi câu trả lời cho Dify AI...');

    google.script.run
      .withSuccessHandler(res => {
        setStatus('✅ AI reply received!', '✅ Đã nhận phản hồi từ AI!');
        displayPracticeAnswer(res.answer);
      })
      .withFailureHandler(err => {
        setStatus('❌ Could not send reply: ' + (err.message || err), '❌ Lỗi gửi phản hồi: ' + (err.message || err));
      })
      .replyPractice({
        message: message,
        sessionToken: practiceSessionToken
      });
  };

  // Automatically fit this iframe to its content; the parent page provides scrolling.
  (function () {
    let previousHeight = 0;
    let queued = false;
    function measure() {
      queued = false;
      if (window.parent === window) return;
      const height = Math.ceil(Math.max(
        document.documentElement.scrollHeight,
        document.body.scrollHeight,
        document.querySelector('.practice-container')?.getBoundingClientRect().bottom || 0
      ));
      if (height > 200 && Math.abs(height - previousHeight) >= 2) {
        previousHeight = height;
        window.parent.postMessage({ type:'ESP_PRACTICE_HEIGHT', height:height }, window.location.origin);
      }
    }
    function scheduleMeasure() {
      if (!queued) { queued = true; requestAnimationFrame(measure); }
    }
    window.addEventListener('message', event => {
      if (event.origin === window.location.origin && event.source === window.parent && event.data?.type === 'ESP_PRACTICE_MEASURE') scheduleMeasure();
    });
    window.addEventListener('load', scheduleMeasure);
    window.addEventListener('resize', scheduleMeasure);
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(scheduleMeasure).observe(document.querySelector('.practice-container'));
    if (typeof MutationObserver !== 'undefined') new MutationObserver(scheduleMeasure).observe(document.body, {subtree:true,childList:true,attributes:true,characterData:true});
    scheduleMeasure();
  })();
</script>
</body>
</html>
